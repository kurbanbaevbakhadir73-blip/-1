<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общага №1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #EEF0F3;
    --paper-2: #E4E7EC;
    --ink: #20242B;
    --ink-soft: #6B7280;
    --line: #E1E4E9;
    --stamp: #E5493E;
    --stamp-bg: #FCE5E2;
    --ledger: #21A366;
    --ledger-bg: #DFF5E9;
    --brass: #F5A623;
    --brass-2: #D6870E;
    --brass-soft: #FFF1D9;
    --future: #ADB3BC;
    --card: #FFFFFF;
    --shadow: rgba(20,24,33,0.07);
    --shadow-lg: rgba(20,24,33,0.12);
    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 12px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #14161B; --paper-2: #1B1E24; --ink: #EEF0F3; --ink-soft: #98A0AC;
      --line: #2B2F37; --stamp: #F17A70; --stamp-bg: #3A2422; --ledger: #5FD79A;
      --ledger-bg: #16281F; --brass: #F7B84B; --brass-2: #F5A623; --brass-soft: #2E2410;
      --future: #565C66; --card: #1D2027; --shadow: rgba(0,0,0,0.35); --shadow-lg: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14161B; --paper-2: #1B1E24; --ink: #EEF0F3; --ink-soft: #98A0AC;
    --line: #2B2F37; --stamp: #F17A70; --stamp-bg: #3A2422; --ledger: #5FD79A;
    --ledger-bg: #16281F; --brass: #F7B84B; --brass-2: #F5A623; --brass-soft: #2E2410;
    --future: #565C66; --card: #1D2027; --shadow: rgba(0,0,0,0.35); --shadow-lg: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'PT Sans', Tahoma, sans-serif; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif { font-family: 'PT Serif', Georgia, serif; }
  .screen { min-height: 100%; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* ---- Login ---- */
  .login-screen {
    align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden;
    background:
      radial-gradient(600px 400px at 15% -10%, var(--brass-soft), transparent 60%),
      radial-gradient(500px 380px at 110% 15%, var(--ledger-bg), transparent 55%),
      var(--paper);
  }
  .login-card {
    width: 100%; max-width: 370px; text-align: center; background: var(--card);
    border-radius: var(--r-lg); padding: 40px 30px 32px;
    box-shadow: 0 24px 60px var(--shadow-lg), 0 2px 8px var(--shadow);
    position: relative; z-index: 1;
  }
  .login-mark {
    width: 64px; height: 64px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 20px; font-size: 30px;
    background: linear-gradient(135deg, var(--brass), var(--brass-2)); color: #fff;
    box-shadow: 0 10px 24px rgba(213,135,14,0.35);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 27px; letter-spacing: 0.2px; }
  .login-card h1 span { color: var(--stamp); }
  .login-sub { margin: 0 0 24px; color: var(--ink-soft); font-size: 14px; }
  #passwordInput {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: var(--r-sm);
    background: var(--paper); color: var(--ink);
    margin-bottom: 12px; font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  #passwordInput:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft); }
  .error-text { color: var(--stamp); font-size: 13px; min-height: 18px; margin: 8px 0 0; font-weight: 600; }

  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    width: 100%; padding: 14px 16px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--brass), var(--brass-2)); color: #fff; border: none; border-radius: var(--r-sm);
    letter-spacing: 0.2px; box-shadow: 0 8px 20px rgba(213,135,14,0.3); transition: transform .1s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-viewer {
    width: 100%; padding: 13px 16px; font-size: 14px; font-weight: 700;
    background: var(--paper-2); color: var(--ink-soft); border: none; border-radius: var(--r-sm);
    margin-top: 10px;
  }
  .btn-viewer:active { background: var(--line); }

  /* ---- Topbar ---- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top,0px) + 16px) 18px 16px;
    background: var(--paper); position: sticky; top: 0; z-index: 5;
    backdrop-filter: blur(10px);
  }
  .topbar > div:nth-child(2) { flex: 1; }
  .brand { font-family: 'PT Serif', serif; font-size: 20px; font-weight: 700; }
  .brand-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 14px;
    border: none; background: var(--card); box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink); font-size: 16px; flex-shrink: 0; position: relative;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge {
    position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px;
    border-radius: 9px; background: var(--stamp); color: #fff; font-size: 10.5px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .viewer-tag {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; background: var(--brass-soft); color: var(--brass-2); margin-left: 8px; vertical-align: middle;
  }
  .complaint-list-item { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-bottom: 10px; background: var(--paper); }
  .complaint-list-item .c-meta { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .complaint-list-item .c-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .complaint-list-item .c-resolve { margin-top: 10px; border: none; background: var(--ledger-bg); color: var(--ledger); font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 20px; }
  textarea.modal-textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
    background: var(--paper); color: var(--ink); font-size: 14.5px; font-family: inherit;
    min-height: 100px; resize: vertical;
  }

  /* ---- Rooms grid ---- */
  .rooms-list { padding: 16px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 13px; align-content: start; }
  .empty-state {
    grid-column: 1 / -1; text-align: center; color: var(--ink-soft); padding: 60px 20px;
    font-size: 14.5px; line-height: 1.6;
  }
  .room-card {
    background: var(--card); border-radius: var(--r-md); padding: 16px 14px;
    box-shadow: 0 2px 10px var(--shadow); position: relative; display: flex; flex-direction: column; gap: 10px;
  }
  .room-icon {
    width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brass), var(--brass-2)); color: #fff;
    font-family: 'PT Serif', serif; font-weight: 700; font-size: 16px;
    box-shadow: 0 6px 14px rgba(213,135,14,0.3);
  }
  .room-price { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .room-card-mid { font-size: 12px; color: var(--ink-soft); }
  .room-card-status {
    display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
    font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 20px;
  }
  .status-ok { background: var(--ledger-bg); color: var(--ledger); }
  .status-bad { background: var(--stamp-bg); color: var(--stamp); }

  /* ---- FAB ---- */
  .fab {
    position: sticky; bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
    align-self: center; margin-top: 8px;
    padding: 14px 24px; border-radius: 30px; border: none;
    background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14.5px;
    box-shadow: 0 10px 24px var(--shadow-lg);
  }

  /* ---- Room detail ---- */
  .year-switch {
    display: flex; align-items: center; justify-content: center; gap: 18px; padding: 10px; background: var(--paper);
  }
  .year-switch button {
    width: 32px; height: 32px; border-radius: 12px; border: none;
    background: var(--card); box-shadow: 0 2px 8px var(--shadow); color: var(--ink); font-size: 16px;
  }
  .year-switch span { font-family: 'PT Serif', serif; font-size: 16px; font-weight: 700; min-width: 50px; text-align: center; }

  .places-list { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .place-card { background: var(--card); border-radius: var(--r-md); overflow: hidden; box-shadow: 0 2px 10px var(--shadow); }
  .place-head { display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer; }
  .place-badge {
    width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--brass-soft); color: var(--brass-2); font-weight: 700; font-size: 15px;
  }
  .place-info { flex: 1; min-width: 0; }
  .place-name-input {
    width: 100%; border: none; background: transparent;
    color: var(--ink); font-weight: 700; font-size: 14.5px; padding: 2px 0; font-family: inherit;
  }
  .place-name-input::placeholder { color: var(--ink-soft); font-weight: 400; font-style: italic; }
  .place-name-input:focus { outline: none; }
  .place-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .due-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; margin-top: 6px;
  }
  .due-badge.ok { background: var(--ledger-bg); color: var(--ledger); }
  .due-badge.warn { background: var(--stamp-bg); color: var(--stamp); animation: pulseBadge 1.8s infinite; }
  .due-badge.neutral { background: var(--paper-2); color: var(--ink-soft); }
  @keyframes pulseBadge { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .place-chevron { color: var(--ink-soft); font-size: 13px; transition: transform .15s; }
  .place-card.open .place-chevron { transform: rotate(90deg); }

  .place-body { border-top: 1px solid var(--line); padding: 4px 14px 16px; }
  .month-row { padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .month-row:last-child { border-bottom: none; }
  .month-line1 { display: flex; align-items: center; gap: 8px; }
  .month-name { width: 74px; flex-shrink: 0; font-weight: 700; }
  .month-future .month-name { color: var(--future); font-weight: 400; }
  .month-status { flex: 1; text-align: right; font-weight: 700; font-size: 12.5px; }
  .month-status.ok { color: var(--ledger); }
  .month-status.bad { color: var(--stamp); }
  .month-status.future { color: var(--future); font-weight: 400; }
  .month-edit-btn {
    border: none; background: var(--brass-soft); color: var(--brass-2); font-size: 12.5px;
    padding: 5px 11px; font-weight: 700; border-radius: 20px; flex-shrink: 0;
  }
  .viewer-mode .month-edit-btn, .viewer-mode .vacate-row { display: none; }
  .month-detail { margin-top: 4px; padding-left: 82px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .month-detail .amt-paid { color: var(--ledger); font-weight: 700; }
  .month-detail .amt-owed { color: var(--stamp); font-weight: 700; }
  .vacate-row { margin-top: 12px; text-align: right; }
  .vacate-row button { border: none; background: none; color: var(--stamp); font-size: 12.5px; padding: 4px; font-weight: 600; }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,17,21,0.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  @media (min-width: 480px) { .modal-overlay { align-items: center; } }
  .modal {
    width: 100%; max-width: 420px; background: var(--card);
    border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 24px 22px calc(env(safe-area-inset-bottom,0px) + 22px);
    max-height: 85vh; overflow-y: auto;
  }
  @media (min-width: 480px) { .modal { border-radius: var(--r-lg); } }
  .modal h3 { margin: 0 0 18px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
    background: var(--paper); color: var(--ink); font-size: 15px; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brass); }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    background: var(--paper-2); color: var(--ink); font-size: 18px;
  }
  .stepper span { font-size: 17px; font-weight: 700; min-width: 24px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn-secondary {
    flex: 1; padding: 13px; border-radius: var(--r-sm); border: 1.5px solid var(--line);
    background: transparent; color: var(--ink); font-size: 14.5px; font-weight: 700;
  }
  .modal-actions .btn-primary { flex: 1; }
  .modal-error { color: var(--stamp); font-size: 13px; margin: -6px 0 12px; font-weight: 600; }
  .modal-danger { color: var(--stamp); background: none; border: none; font-size: 13px; padding: 8px 0; text-align: left; font-weight: 600; }
</style>

</head>
<body>

<div id="loginScreen" class="screen login-screen">
  <div class="login-card">
    <div class="login-mark">🏠</div>
    <h1>Общага <span>№1</span></h1>
    <input id="passwordInput" type="password" placeholder="Parol" autocomplete="current-password">
    <p id="loginError" class="error-text"></p>
    <button id="loginBtn" class="btn-primary">Kirish</button>
    <button id="viewerBtn" class="btn-viewer">👀 Kuzatuvchi sifatida kirish</button>
  </div>
</div>

<div id="roomsScreen" class="screen" hidden>
  <header class="topbar">
    <div>
      <div class="brand">Общага №1</div>
      <div class="brand-sub" id="roomsSub">Xonalar</div>
    </div>
    <div class="topbar-actions">
      <button id="complaintBtn" class="icon-btn" hidden>✉</button>
      <button id="bellBtn" class="icon-btn" hidden>🔔<span id="bellBadge" class="badge" hidden>0</span></button>
      <button id="settingsBtn" class="icon-btn" hidden>⚙</button>
    </div>
  </header>
  <div id="roomsList" class="rooms-list"></div>
  <button id="addRoomBtn" class="fab" hidden>+ Yangi xona</button>
</div>

<div id="roomScreen" class="screen" hidden>
  <header class="topbar">
    <button id="backBtn" class="icon-btn">←</button>
    <div>
      <div class="brand" id="roomTitle"></div>
      <div class="brand-sub" id="roomSub"></div>
    </div>
    <div class="topbar-actions">
      <button id="complaintBtn2" class="icon-btn" hidden>✉</button>
      <button id="roomMenuBtn" class="icon-btn" hidden>⋮</button>
    </div>
  </header>
  <div class="year-switch">
    <button id="yearPrev">‹</button>
    <span id="yearLabel"></span>
    <button id="yearNext">›</button>
  </div>
  <div id="placesList" class="places-list"></div>
  <button id="addPlaceBtn" class="fab" hidden>+ Joy qo'shish</button>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div id="modalBody" class="modal"></div>
</div>

<script>
(function(){
  "use strict";

  var MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
  var fmt = function(n){ n = Math.round(n||0); return n.toLocaleString('ru-RU').replace(/,/g,' '); };
  var today = new Date();
  var CUR_YEAR = today.getFullYear();
  var CUR_MONTH = today.getMonth();

  var db = null;
  var currentRole = null; // "admin" | "viewer"
  var rooms = [];
  var roomsUnsub = null;
  var currentRoomId = null;
  var currentRoomYear = CUR_YEAR;
  var places = [];
  var placesUnsub = null;
  var openPlaceId = null;

  function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
  function monthKey(y, m){ return y + "-" + String(m+1).padStart(2,"0"); }
  function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  function show(id){
    ["loginScreen","roomsScreen","roomScreen"].forEach(function(s){
      document.getElementById(s).hidden = (s !== id);
    });
  }

  function openModal(html){
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modalOverlay").hidden = false;
  }
  function closeModal(){
    document.getElementById("modalOverlay").hidden = true;
    document.getElementById("modalBody").innerHTML = "";
  }
  document.getElementById("modalOverlay").addEventListener("click", function(e){
    if (e.target.id === "modalOverlay") closeModal();
  });

  // ---------- INIT / LOGIN ----------
  // ==========================================================
  // Yengil ma'lumotlar ombori — hech qanday tashqi xizmat kerak emas.
  // Ma'lumotlar shu brauzer xotirasida (localStorage) saqlanadi.
  // Diqqat: boshqa qurilma/brauzerda ochilsa, u alohida, bo'sh ro'yxat bilan boshlanadi —
  // ma'lumotlar qurilmalar orasida avtomatik sinxronlanmaydi.
  // ==========================================================
  function createLocalDB(){
    var KEY = "obshaga_store_v1";
    var store = {};
    try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ store = {}; }
    var subs = [];

    function persist(){
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
      subs.forEach(function(s){ try { s.cb(buildSnapshot(s)); } catch(e){} });
    }
    function segs(p){ return p.split("/").filter(Boolean); }
    function genId(){ return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
    function docsUnder(collPath){
      var prefix = collPath + "/";
      var out = [];
      Object.keys(store).forEach(function(k){
        if (k.indexOf(prefix) === 0){
          var rest = k.slice(prefix.length);
          if (rest.length && rest.indexOf("/") === -1) out.push({ id: rest, path: k, data: store[k] });
        }
      });
      return out;
    }
    function buildSnapshot(q){
      var docs = docsUnder(q.collPath);
      (q.filters||[]).forEach(function(f){
        docs = docs.filter(function(d){
          var v = d.data[f.field];
          if (f.op === "==") return v === f.value;
          if (f.op === "!=") return v !== f.value;
          return true;
        });
      });
      if (q.orderField){
        docs.sort(function(a,b){
          var av=a.data[q.orderField], bv=b.data[q.orderField];
          if (av===undefined && bv===undefined) return 0;
          if (av===undefined) return 1;
          if (bv===undefined) return -1;
          if (av<bv) return q.orderDir==="desc" ? 1 : -1;
          if (av>bv) return q.orderDir==="desc" ? -1 : 1;
          return 0;
        });
      } else {
        docs.sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
      }
      if (q.limitN) docs = docs.slice(0, q.limitN);
      return {
        docs: docs.map(function(d){ return { id: d.id, exists: true, data: function(){ return d.data; } }; }),
        size: docs.length,
        empty: docs.length === 0
      };
    }
    function docRef(path){
      return {
        id: segs(path).slice(-1)[0],
        path: path,
        get: function(){
          return Promise.resolve({ id: segs(path).slice(-1)[0], exists: !!store[path], data: function(){ return store[path]; } });
        },
        set: function(data){
          store[path] = JSON.parse(JSON.stringify(data));
          persist();
          return Promise.resolve();
        },
        update: function(data){
          if (!store[path]) return Promise.reject({ code: "invalid_argument", message: "Hujjat topilmadi" });
          var cur = store[path];
          Object.keys(data).forEach(function(k){
            var v = data[k];
            if (v && typeof v === "object" && !Array.isArray(v) && cur[k] && typeof cur[k] === "object"){
              cur[k] = Object.assign({}, cur[k], v);
            } else {
              cur[k] = v;
            }
          });
          persist();
          return Promise.resolve();
        },
        delete: function(){ delete store[path]; persist(); return Promise.resolve(); }
      };
    }
    function collRef(path){
      var filters = [], orderField = null, orderDir = "asc", limitN = null;
      var q = {
        where: function(f,op,v){ filters.push({field:f,op:op,value:v}); return q; },
        orderBy: function(f,d){ orderField = f; orderDir = d || "asc"; return q; },
        limit: function(n){ limitN = n; return q; },
        doc: function(id){ return docRef(path + "/" + (id || genId())); },
        add: function(data){
          var id = genId();
          store[path + "/" + id] = JSON.parse(JSON.stringify(data));
          persist();
          return Promise.resolve(docRef(path + "/" + id));
        },
        get: function(){ return Promise.resolve(buildSnapshot({collPath:path,filters:filters,orderField:orderField,orderDir:orderDir,limitN:limitN})); },
        onSnapshot: function(next, err){
          var sub = { collPath: path, filters: filters, orderField: orderField, orderDir: orderDir, limitN: limitN, cb: next };
          subs.push(sub);
          setTimeout(function(){ next(buildSnapshot(sub)); }, 0);
          return function(){ var i = subs.indexOf(sub); if (i>=0) subs.splice(i,1); };
        }
      };
      return q;
    }
    return {
      doc: function(p){ return docRef(p); },
      collection: function(p){ return collRef(p); },
      exportData: function(){ return JSON.stringify(store, null, 2); },
      importData: function(jsonStr){ store = JSON.parse(jsonStr); persist(); }
    };
  }

  function roomMonthDebt(room, place){
    if (!place.name) return 0;
    var req = room.monthlyPrice||0;
    var paid = (place.payments && place.payments[monthKey(CUR_YEAR,CUR_MONTH)]) || 0;
    return Math.max(0, req - paid);
  }

  function computeDueBadge(room, place){
    if (!place.name) return null;
    var dim = daysInMonth(CUR_YEAR, CUR_MONTH);
    var monthlyPrice = room.monthlyPrice || 0;
    var dailyRate = monthlyPrice / dim;
    var paid = (place.payments && place.payments[monthKey(CUR_YEAR,CUR_MONTH)]) || 0;
    var paidDays = dailyRate > 0 ? Math.min(dim, Math.floor(paid / dailyRate)) : 0;
    var todayDay = today.getDate();
    if (paidDays >= dim){
      return { type: "ok", text: "✓ Bu oy to'langan" };
    }
    var dueDay = paidDays + 1;
    if (todayDay >= dueDay){
      var overdue = todayDay - paidDays;
      return { type: "warn", text: "⏰ To'lov vaqti keldi (" + overdue + " kun)" };
    }
    return { type: "neutral", text: dueDay + "-sanagacha to'langan" };
  }

  function renderRoomDetail(){
    var room = currentRoom();
    if (!room) return;
    document.getElementById("roomTitle").textContent = room.number + "-xona";
    document.getElementById("roomSub").textContent = fmt(room.monthlyPrice) + " so'm/oy · " + places.length + " joy";
    document.getElementById("yearLabel").textContent = currentRoomYear;
    document.getElementById("yearPrev").disabled = (currentRoomYear <= CUR_YEAR);

    var el = document.getElementById("placesList");
    el.className = "places-list" + (currentRole === "viewer" ? " viewer-mode" : "");
    el.innerHTML = "";
    places.forEach(function(place){
      var card = document.createElement("div");
      card.className = "place-card" + (openPlaceId === place.id ? " open" : "");

      var yearDebt = 0;
      for (var m=0; m<12; m++){
        if (!place.name) continue;
        var isFuture0 = currentRoomYear > CUR_YEAR || (currentRoomYear === CUR_YEAR && m > CUR_MONTH);
        var paid0 = (place.payments && place.payments[monthKey(currentRoomYear,m)]) || 0;
        if (isFuture0 && paid0 <= 0) continue; // hali boshlanmagan va hech narsa to'lanmagan oy — qarzga qo'shilmaydi
        var req = room.monthlyPrice||0;
        yearDebt += Math.max(0, req - paid0);
      }
      var dueBadge = computeDueBadge(room, place);

      var head = document.createElement("div");
      head.className = "place-head";
      head.innerHTML =
        '<div class="place-badge">' + place.placeNumber + '</div>' +
        '<div class="place-info">' +
          '<input class="place-name-input" id="headName_'+place.id+'" type="text" placeholder="Ism familiya yozing" value="'+esc(place.name)+'">' +
          '<div class="place-sub">' + (place.name ? (yearDebt>0 ? (fmt(yearDebt)+" so'm qarz ("+currentRoomYear+")") : ("Qarzi yo'q ("+currentRoomYear+")")) : "Ism kiritilmagan") + '</div>' +
          (dueBadge ? ('<div class="due-badge ' + dueBadge.type + '">' + dueBadge.text + '</div>') : '') +
        '</div>' +
        '<div class="place-chevron">▸</div>';
      head.addEventListener("click", function(e){
        if (e.target.tagName === "INPUT") return;
        openPlaceId = (openPlaceId === place.id) ? null : place.id;
        renderRoomDetail();
      });

        headNameInput.addEventListener("keydown", function(e){ if (e.key === "Enter") e.target.blur(); });
        headNameInput.addEventListener("blur", function(e){
          var val = e.target.value.trim();
          if (val === (place.name||"")) return;
          db.doc("rooms/"+currentRoomId+"/places/"+place.id).update({ name: val }).catch(function(){});
        });
      }

      if (openPlaceId === place.id){
        var body = document.createElement("div");
        body.className = "place-body";

        var startMi = (currentRoomYear === CUR_YEAR) ? CUR_MONTH : (currentRoomYear > CUR_YEAR ? 0 : 12);
        if (startMi >= 12){
          var noteEl = document.createElement("div");
          noteEl.className = "month-detail";
          noteEl.style.padding = "10px 2px";
          noteEl.textContent = "O'tgan yillar ko'rsatilmaydi.";
          body.appendChild(noteEl);
        }
        for (var mi=startMi; mi<12; mi++){
          var isFut = currentRoomYear > CUR_YEAR || (currentRoomYear === CUR_YEAR && mi > CUR_MONTH);
          var dim = daysInMonth(currentRoomYear, mi);
          var req2 = room.monthlyPrice||0;
          var dailyRate2 = req2 / dim;
          var paid2 = (place.payments && place.payments[monthKey(currentRoomYear,mi)]) || 0;
          var paidDays = (dailyRate2>0) ? Math.min(dim, Math.floor(paid2 / dailyRate2)) : 0;
          var unpaidDays = dim - paidDays;
          var owed = Math.max(0, req2 - paid2);

          var row = document.createElement("div");
          row.className = "month-row" + (isFut ? " month-future" : "");
          var statusHtml, detailHtml;
          if (!place.name){
            statusHtml = '<span class="month-status future">bo\'sh joy</span>';
            detailHtml = "";
          } else if (isFut && paid2 <= 0){
            statusHtml = '<span class="month-status future">kelgusi</span>';
            detailHtml = "Oylik narx: " + fmt(req2) + " so'm (" + dim + " kun, kunlar sonidan qat'i nazar bir xil)";
          } else if (paid2 <= 0){
            statusHtml = '<span class="month-status bad">to\'lanmagan</span>';
            detailHtml = "0 / " + dim + " kun to'langan · barcha " + dim + " kun uchun <span class=\"amt-owed\">" + fmt(req2) + " so'm qarz</span>";
          } else if (paid2 >= req2){
            statusHtml = '<span class="month-status ok">to\'langan</span>' + (isFut ? ' <span class="month-status future">(oldindan)</span>' : '');
            detailHtml = dim + " / " + dim + " kun to'langan — <span class=\"amt-paid\">" + fmt(paid2) + " so'm</span>" + (paid2>req2 ? (" (ortiqcha " + fmt(paid2-req2) + " so'm)") : "");
          } else {
            statusHtml = '<span class="month-status bad">qisman to\'langan</span>';
            detailHtml = "1–" + paidDays + "-kun to'landi (<span class=\"amt-paid\">" + fmt(paid2) + " so'm</span>) · " +
              (paidDays+1) + "–" + dim + "-kun (" + unpaidDays + " kun) to'lanmagan — <span class=\"amt-owed\">" + fmt(owed) + " so'm qarz</span>";
          }
          row.innerHTML =
            '<div class="month-line1">' +
              '<span class="month-name">' + MONTHS[mi] + '</span>' +
              statusHtml +
              '<button class="month-edit-btn" data-m="'+mi+'">✎ to\'lov</button>' +
            '</div>' +
            (detailHtml ? '<div class="month-detail">' + detailHtml + '</div>' : '');
          row.querySelector(".month-edit-btn").addEventListener("click", (function(place, room, mi){
            return function(){ showPaymentModal(place, room, currentRoomYear, mi); };
          })(place, room, mi));
          body.appendChild(row);
        }

        var vacateRow = document.createElement("div");
        vacateRow.className = "vacate-row";
        vacateRow.innerHTML = '<button id="vacate_'+place.id+'">Joyni bo\'shatish</button>';
        body.appendChild(vacateRow);

        card.appendChild(body);
        el.appendChild(card);

        document.getElementById("vacate_"+place.id).addEventListener("click", async function(){
          try { await db.doc("rooms/"+currentRoomId+"/places/"+place.id).set({ placeNumber: place.placeNumber, name: "", payments: {} }); }
          catch(e){}
        });
      } else {
        el.appendChild(card);
      }
    });

    if (!places.length){
      el.innerHTML = '<div class="empty-state">Bu xonada hali joylar yo\'q.</div>';
    }
  }

  function showPaymentModal(place, room, year, monthIdx){
    var key = monthKey(year, monthIdx);
    var current = (place.payments && place.payments[key]) || 0;
    var req = room.monthlyPrice||0;
    openModal(
      '<h3>' + MONTHS[monthIdx] + ' ' + year + ' — ' + (place.placeNumber) + '-joy</h3>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin-top:-8px;">Kerakli summa: ' + fmt(req) + " so'm/oy (" + daysInMonth(year,monthIdx) + ' kun, doimiy)</p>' +
      '<div class="field"><label>To\'langan summa (so\'m)</label><input id="mAmount" type="number" value="'+current+'"></div>' +
      '<p class="modal-error" id="mErr"></p>' +
      '<div class="modal-actions"><button class="btn-secondary" id="mCancel">Bekor qilish</button><button class="btn-primary" id="mSave">Saqlash</button></div>'
    );
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("mSave").addEventListener("click", async function(){
      var amount = parseFloat(document.getElementById("mAmount").value);
      if (isNaN(amount) || amount < 0){
        document.getElementById("mErr").textContent = "Summani to'g'ri kiriting.";
        return;
      }
      var btn = document.getElementById("mSave"); btn.textContent = "Saqlanmoqda..."; btn.disabled = true;
      try {
        var payments = {}; payments[key] = amount;
        await db.doc("rooms/"+currentRoomId+"/places/"+place.id).update({ payments: payments });
        closeModal();
      } catch(e){
        document.getElementById("mErr").textContent = "Saqlashda xatolik.";
        btn.textContent = "Saqlash"; btn.disabled = false;
      }
    });
  }

  async function addPlace(){
    var maxNum = places.reduce(function(m,p){ return Math.max(m, p.placeNumber||0); }, 0);
    try {
      await db.collection("rooms/"+currentRoomId+"/places").add({ placeNumber: maxNum+1, name: "", payments: {} });
      var room = currentRoom();
      await db.doc("rooms/"+currentRoomId).update({ placesCount: (room.placesCount||maxNum)+1 });
    } catch(e){}
  }

  function showRoomMenu(){
    var room = currentRoom();
    if (!room) return;
    openModal(
      '<h3>Xonani tahrirlash</h3>' +
      '<div class="field"><label>Xona raqami</label><input id="mRoomNumber" type="text" value="'+(room.number||"").toString().replace(/"/g,"&quot;")+'"></div>' +
      '<div class="field"><label>Oylik narxi (so\'m) — kunlar sonidan qat\'i nazar bir xil</label><input id="mRoomPrice" type="number" value="'+(room.monthlyPrice||0)+'"></div>' +
      '<p class="modal-error" id="mErr"></p>' +
      '<div class="modal-actions"><button class="btn-secondary" id="mCancel">Bekor qilish</button><button class="btn-primary" id="mSave">Saqlash</button></div>' +
      '<button class="modal-danger" id="mDelete">Xonani butunlay o\'chirish</button>'
    );
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("mSave").addEventListener("click", async function(){
      var num = document.getElementById("mRoomNumber").value.trim();
      var price = parseFloat(document.getElementById("mRoomPrice").value);
      if (!num || isNaN(price) || price<=0){
        document.getElementById("mErr").textContent = "Ma'lumotlarni to'g'ri kiriting.";
        return;
      }
      try {
        await db.doc("rooms/"+currentRoomId).update({ number: num, monthlyPrice: price });
        closeModal();
      } catch(e){ document.getElementById("mErr").textContent = "Xatolik yuz berdi."; }
    });
    document.getElementById("mDelete").addEventListener("click", async function(){
      if (!confirm("Xona va undagi barcha joylar/to'lovlar o'chiriladi. Davom etilsinmi?")) return;
      try {
        var snap = await db.collection("rooms/"+currentRoomId+"/places").get();
        for (var i=0; i<snap.docs.length; i++){
          await db.doc("rooms/"+currentRoomId+"/places/"+snap.docs[i].id).delete();
        }
        await db.doc("rooms/"+currentRoomId).delete();
        closeModal();
        if (placesUnsub) { placesUnsub(); placesUnsub = null; }
        currentRoomId = null; openPlaceId = null;
        show("roomsScreen");
        renderRoomsList();
      } catch(e){ document.getElementById("mErr").textContent = "O'chirishda xatolik."; }
    });
  }

  init();
})();
</script>
</body>
</html>
